name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # Windows dahil tam matrisi elle tetiklemek için

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Linters
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]

    env:
      # Hem cache adımının hem de pytest'in aynı dizini kullanması için sabitliyoruz
      # (varsayılan ~/.cache/huggingface yolu Windows ve Linux'ta farklı).
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # tests/test_server.py'deki fixture round trip testi gerçek bge-m3 + reranker
      # yüklüyor. Cache olmadan her koşu ~4.5 GB model indiriyor; cache ile ilk
      # koşudan sonra CI hızlı şeritte kalıyor. Model kimlikleri config.py'de.
      #
      # Neden yalnızca Linux: iki modelin toplamı ~4.5 GB, matrisin iki OS'una da
      # verilirse ~9 GB eder ve GitHub'ın repo başına 10 GB cache limitini doldurup
      # pip cache'ini eviction'a sokar. Windows job'ı modelleri indirmeye devam eder.
      - name: Cache Hugging Face models
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ matrix.os }}-${{ hashFiles('src/doqqy/config.py') }}
          restore-keys: |
            hf-${{ matrix.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qdrant]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Unit Tests (Exclude Slow/Model Tests)
        run: pytest -m "not slow"

  qdrant-integration:
    name: Run Qdrant Container Integration Tests
    # GitHub Actions service containers only run on Linux-hosted runners, so this is a
    # separate ubuntu-only job rather than an addition to the `test` matrix above — adding
    # `services:` to a job whose matrix also includes windows-latest breaks the Windows leg.
    runs-on: ubuntu-latest
    env:
      DOQQY_QDRANT_URL: http://localhost:6333
      HF_HOME: ${{ github.workspace }}/.hf-cache

    services:
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-ubuntu-latest-${{ hashFiles('src/doqqy/config.py') }}
          restore-keys: |
            hf-ubuntu-latest-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qdrant]"

      - name: Run Qdrant Container Integration Tests
        run: pytest -m slow tests/integration/test_qdrant_store.py -v

      - name: Run Retrieval Evaluation Harness (Qdrant Baseline Check)
        run: python -m tests.eval --backend qdrant --check-baseline

  eval:
    name: Run Retrieval Evaluation Harness
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-ubuntu-latest-${{ hashFiles('src/doqqy/config.py') }}
          restore-keys: |
            hf-ubuntu-latest-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Evaluation Baseline Check
        run: python -m tests.eval --backend lancedb --check-baseline
